services:
  cloudexplorer:
    image: ${CE_IMAGE_REPOSITORY}cloudexplorer-core:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
    hostname: cloudexplorer
    container_name: cloudexplorer
    ports:
      - "${CE_PORT:-80}:9000"
    env_file:
      - path: ${CE_BASE:-/opt}/cloudexplorer/.env
        required: false
    environment:
      CE_BASE: ${CE_BASE:-/opt}
      CE_SERVER_HOST: ${CE_SERVER_HOST}
      CE_JWT_EXPIRE_MINUTES: ${CE_JWT_EXPIRE_MINUTES:-100}
      CE_EXTERNAL_MYSQL: ${CE_EXTERNAL_MYSQL:-false}
      CE_MYSQL_HOST: ${CE_MYSQL_HOST:-mysql}
      CE_MYSQL_PORT: ${CE_MYSQL_PORT:-3306}
      CE_MYSQL_DB: ${CE_MYSQL_DB:-ce}
      CE_MYSQL_USER: ${CE_MYSQL_USER:-root}
      CE_MYSQL_PASSWORD: ${CE_MYSQL_PASSWORD:-Password123@mysql}
      CE_QUARTZ_MYSQL_HOST: ${CE_QUARTZ_MYSQL_HOST:-${CE_MYSQL_HOST:-mysql}}
      CE_QUARTZ_MYSQL_PORT: ${CE_QUARTZ_MYSQL_PORT:-${CE_MYSQL_PORT:-3306}}
      CE_QUARTZ_MYSQL_DB: ${CE_QUARTZ_MYSQL_DB:-quartz}
      CE_QUARTZ_MYSQL_USER: ${CE_QUARTZ_MYSQL_USER:-${CE_MYSQL_USER:-root}}
      CE_QUARTZ_MYSQL_PASSWORD: ${CE_QUARTZ_MYSQL_PASSWORD:-${CE_MYSQL_PASSWORD:-Password123@mysql}}
      CE_EXTERNAL_REDIS: ${CE_EXTERNAL_REDIS:-false}
      CE_REDIS_HOST: ${CE_REDIS_HOST:-redis}
      CE_REDIS_PORT: ${CE_REDIS_PORT:-6379}
      CE_REDIS_PASSWORD: ${CE_REDIS_PASSWORD:-Password123@redis}
      CE_EXTERNAL_ELASTICSEARCH: ${CE_EXTERNAL_ELASTICSEARCH:-false}
      CE_ELASTICSEARCH_HOST: ${CE_ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      CE_EXTERNAL_LOGSTASH: ${CE_EXTERNAL_LOGSTASH:-false}
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      elasticsearch:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "127.0.0.1:9000"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/logs:/opt/cloudexplorer/logs
      - ${CE_BASE:-/opt}/cloudexplorer/conf:/opt/cloudexplorer/conf
      - ${CE_BASE:-/opt}/cloudexplorer/apps/extra:/opt/cloudexplorer/apps/extra
      - ${CE_BASE:-/opt}/cloudexplorer/downloads:/opt/cloudexplorer/downloads
      - ${CE_BASE:-/opt}/cloudexplorer/data:/opt/cloudexplorer/data
    networks:
      - ce-network
    deploy:
      resources:
        limits:
          memory: ${CE_CORE_MEMORY_LIMIT:-8G}

  mysql:
    image: ${CE_MYSQL_IMAGE_REPOSITORY:-registry.cn-qingdao.aliyuncs.com/cloudexplorer/}mysql:${CE_MYSQL_VERSION:-8.0}
    container_name: cloudexplorer-mysql
    profiles: ["builtin-mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${CE_MYSQL_PASSWORD:-Password123@mysql}
      MYSQL_DATABASE: ${CE_MYSQL_DB:-ce}
      TZ: Asia/Shanghai
    command:
      - --default-time_zone=+8:00
      - --default-storage-engine=INNODB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower-case-table-names=1
      - --table-open-cache=128
      - --max-connections=1000
      - --max-connect-errors=6000
      - --innodb-file-per-table=1
      - --innodb-buffer-pool-size=1G
      - --max-allowed-packet=64M
      - --transaction-isolation=READ-COMMITTED
      - --innodb-flush-method=O_DIRECT
      - --innodb-lock-wait-timeout=1800
      - --innodb-flush-log-at-trx-commit=0
      - --sync-binlog=0
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --skip-name-resolve
      - --wait-timeout=28800
    ports:
      - "${CE_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CE_MYSQL_PASSWORD:-Password123@mysql}"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/mysql:/var/lib/mysql
    networks:
      - ce-network

  redis:
    image: ${CE_REDIS_IMAGE_REPOSITORY:-registry.cn-qingdao.aliyuncs.com/cloudexplorer/}redis:${CE_REDIS_VERSION:-7.0.8-alpine}
    container_name: cloudexplorer-redis
    profiles: ["builtin-redis"]
    command: ["redis-server", "--requirepass", "${CE_REDIS_PASSWORD:-Password123@redis}"]
    ports:
      - "${CE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CE_REDIS_PASSWORD:-Password123@redis}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/redis:/data
    networks:
      - ce-network

  elasticsearch:
    image: ${CE_ELASTICSEARCH_IMAGE_REPOSITORY:-registry.cn-qingdao.aliyuncs.com/cloudexplorer/}elasticsearch:${CE_ELASTICSEARCH_VERSION:-7.17.9}
    container_name: cloudexplorer-elasticsearch
    profiles: ["builtin-elasticsearch"]
    environment:
      discovery.type: single-node
      cluster.name: ${CE_ELASTICSEARCH_CLUSTER_NAME:-ce-elasticsearch-cluster}
      node.name: ${CE_ELASTICSEARCH_NODE_NAME:-es01}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    ports:
      - "${CE_ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 40
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/elk/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - ce-network
    deploy:
      resources:
        limits:
          memory: ${CE_ELASTICSEARCH_MEM_LIMIT:-1073741824}

  kibana:
    image: ${CE_KIBANA_IMAGE_REPOSITORY:-registry.cn-qingdao.aliyuncs.com/cloudexplorer/}kibana:${CE_KIBANA_VERSION:-7.17.9}
    container_name: cloudexplorer-kibana
    profiles: ["kibana"]
    environment:
      ELASTICSEARCH_HOSTS: ${CE_KIBANA_ELASTICSEARCH_HOST:-http://elasticsearch:9200}
    ports:
      - "${CE_KIBANA_PORT:-5601}:5601"
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/elk/kibana:/usr/share/kibana/data
    networks:
      - ce-network

  logstash:
    image: ${CE_LOGSTASH_IMAGE_REPOSITORY:-registry.cn-qingdao.aliyuncs.com/cloudexplorer/}logstash:${CE_LOGSTASH_VERSION:-7.17.9}
    container_name: cloudexplorer-logstash
    profiles: ["logstash"]
    environment:
      ELASTICSEARCH_HOSTS: ${CE_LOGSTASH_ELASTICSEARCH_HOST:-http://elasticsearch:9200}
    volumes:
      - ${CE_BASE:-/opt}/cloudexplorer/elk/logstash:/usr/share/logstash/data
    networks:
      - ce-network

networks:
  ce-network:
    name: cloudexplorer-network
    driver: bridge
    ipam:
      config:
        - subnet: ${CE_DOCKER_SUBNET:-172.20.0.0/16}
          gateway: ${CE_DOCKER_GATEWAY:-172.20.0.1}
